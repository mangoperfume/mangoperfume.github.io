<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mango Perfume</title>
<style>
/* VOICE: quiet, elegant — the brand's own logo carries everything
IDEA: the label on a perfume box: logo, then the ways to reach you
PICTURE: the Mango Perfume wordmark, large and centred
COLOUR and TYPE: the brand's pale grey ground, black, one red; no visible text at all
LAYOUT: one centred column — logo, thin red rule, a row of round icon buttons */
:root{color-scheme:light;--bg:#f1f1f3;--ink:#111;--red:#d42a2a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip;
display:flex;align-items:center;justify-content:center;padding:32px 20px}
main{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:clamp(28px,6vh,48px)}
.logo{width:min(84vw,380px);height:auto;display:block}
.rule{width:56px;height:2px;background:var(--red);border-radius:2px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,5vw,26px)}
.links a{width:clamp(60px,17vw,72px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
background:var(--ink);color:#fff;transition:transform .2s ease,background .2s ease,box-shadow .2s ease;
box-shadow:0 8px 18px rgba(0,0,0,.14)}
.links a:hover{background:var(--red);transform:translateY(-3px)}
.links a:active{transform:translateY(1px)}
.links a:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.links svg{width:44%;height:44%}
@media (prefers-reduced-motion:no-preference){
main>*{animation:in .7s ease both}.rule{animation-delay:.15s}.links{animation-delay:.3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}}
</style>
</head>
